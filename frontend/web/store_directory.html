<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinMall Spatial Directory — Interactive Store Finder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    .glass-card { background: rgba(21, 29, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
  <div id="app-nav"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const STORES = [
      { id: 101, name: 'Zara Flagship', floor: 'Floor 2', unit: 'Unit 201-203', cat: 'Fashion', deals: 'UP TO 50% OFF', icon: '👗', phone: '028 3823 9000', hours: '09:30 - 22:00' },
      { id: 102, name: 'Uniqlo VinMall', floor: 'Floor 2', unit: 'Unit 205-208', cat: 'Fashion', deals: 'NEW ARRIVALS', icon: '👕', phone: '028 3823 8888', hours: '09:30 - 22:00' },
      { id: 103, name: 'Pedro Accessories', floor: 'Floor 2', unit: 'Unit 204', cat: 'Bags & Shoes', deals: '15% OFF MEMBER', icon: '👜', phone: '028 3823 7777', hours: '10:00 - 22:00' },
      { id: 104, name: 'Nike Concept Store', floor: 'Floor 1', unit: 'Unit 102', cat: 'Footwear', deals: 'CLEARANCE SALE', icon: '👟', phone: '028 3823 6666', hours: '09:30 - 22:00' },
      { id: 105, name: 'Apple Premium Reseller', floor: 'Floor 1', unit: 'Unit 110', cat: 'Electronics', deals: 'VOUCHER 1,000k', icon: '📱', phone: '028 3823 5555', hours: '09:30 - 22:00' },
      { id: 106, name: 'Starbucks Reserve', floor: 'Ground', unit: 'Unit G01', cat: 'Dining & Cafe', deals: 'BUY 1 GET 1 FRI', icon: '☕', phone: '028 3823 4444', hours: '07:00 - 22:30' },
      { id: 107, name: 'Haidilao Hotpot', floor: 'Food Court', unit: 'Unit F50', cat: 'Dining', deals: 'FREE MANICURE', icon: '🍲', phone: '028 3823 3333', hours: '10:00 - 02:00' },
      { id: 108, name: 'Sephora Beauty', floor: 'Floor 1', unit: 'Unit 115', cat: 'Beauty & Cosmetics', deals: 'FREE SAMPLES', icon: '💄', phone: '028 3823 2222', hours: '09:30 - 22:00' }
    ];

    function App() {
      const [selectedFloor, setSelectedFloor] = useState('All');
      const [selectedCat, setSelectedCat] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [modalStore, setModalStore] = useState(null);

      const filteredStores = STORES.filter(s => {
        if (selectedFloor !== 'All' && s.floor !== selectedFloor) return false;
        if (selectedCat !== 'All' && s.cat !== selectedCat) return false;
        if (searchQuery && !s.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
        return true;
      });

      return (
        <div className="flex-1 flex flex-col space-y-6 p-6">

          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div className="w-72">
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="🔍 Search store name..."
                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#f04b4c]"
              />
            </div>
          </div>

          <div className="glass-card rounded-2xl p-4 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <span className="text-xs text-slate-400 font-semibold mr-2">Floor Map:</span>
              {['All', 'Ground', 'Floor 1', 'Floor 2', 'Food Court'].map(f => (
                <button
                  key={f}
                  onClick={() => setSelectedFloor(f)}
                  className={`text-xs px-3.5 py-1.5 rounded-xl border font-semibold transition ${
                    selectedFloor === f ? 'bg-[#f04b4c] border-[#e0474c] text-white shadow-lg' : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'
                  }`}
                >
                  {f}
                </button>
              ))}
            </div>

            <div className="flex items-center space-x-2">
              <span className="text-xs text-slate-400 font-semibold mr-2">Category:</span>
              {['All', 'Fashion', 'Footwear', 'Bags & Shoes', 'Electronics', 'Dining'].map(c => (
                <button
                  key={c}
                  onClick={() => setSelectedCat(c)}
                  className={`text-xs px-3 py-1 rounded-lg font-medium transition ${
                    selectedCat === c ? 'bg-slate-800 text-[#7acfd6] border border-[#7acfd6]/50' : 'text-slate-500 hover:text-slate-300'
                  }`}
                >
                  {c}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-4 gap-5">
            {filteredStores.map(store => (
              <div
                key={store.id}
                onClick={() => setModalStore(store)}
                className="glass-card rounded-2xl p-5 border border-slate-800 hover:border-[#f04b4c]/60 transition cursor-pointer group flex flex-col justify-between"
              >
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-3xl">{store.icon}</span>
                    <span className="bg-[#f04b4c]/20 text-[#f04b4c] text-[10px] font-bold px-2 py-0.5 rounded-full border border-[#f04b4c]/30">
                      {store.deals}
                    </span>
                  </div>

                  <h3 className="font-bold text-white group-hover:text-[#7acfd6] transition text-sm mb-1">{store.name}</h3>
                  <div className="text-xs text-[#7acfd6] font-medium">{store.floor} • {store.unit}</div>
                </div>

                <div className="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                  <span>⏰ {store.hours}</span>
                  <span className="text-[#f04b4c] font-semibold group-hover:translate-x-1 transition">Details ➔</span>
                </div>
              </div>
            ))}
          </div>

          {modalStore && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="glass-card max-w-md w-full rounded-2xl p-6 border border-slate-700 shadow-2xl">
                <div className="flex justify-between items-start mb-4">
                  <div className="flex items-center space-x-3">
                    <span className="text-4xl">{modalStore.icon}</span>
                    <div>
                      <h3 className="text-lg font-bold text-white">{modalStore.name}</h3>
                      <p className="text-xs text-[#7acfd6] font-semibold">{modalStore.floor} • {modalStore.unit}</p>
                    </div>
                  </div>
                  <button onClick={() => setModalStore(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="bg-slate-900/80 rounded-xl p-4 mb-4 space-y-2 border border-slate-800 text-xs">
                  <div className="flex justify-between text-slate-300">
                    <span className="text-slate-400">Category:</span>
                    <span className="font-semibold">{modalStore.cat}</span>
                  </div>
                  <div className="flex justify-between text-slate-300">
                    <span className="text-slate-400">Operating Hours:</span>
                    <span className="font-semibold">{modalStore.hours}</span>
                  </div>
                  <div className="flex justify-between text-slate-300">
                    <span className="text-slate-400">Store Contact:</span>
                    <span className="font-mono text-[#7acfd6]">{modalStore.phone}</span>
                  </div>
                </div>

                <div className="bg-[#f04b4c]/10 border border-[#f04b4c]/30 rounded-xl p-3 mb-6 text-center text-xs text-[#f04b4c] font-bold">
                  🔥 Active Promotion: {modalStore.deals}
                </div>

                <div className="flex space-x-3">
                  <button onClick={() => setModalStore(null)} className="flex-1 bg-slate-800 text-slate-300 text-xs font-semibold py-2.5 rounded-xl border border-slate-700">
                    Close
                  </button>
                  <button onClick={() => alert(`Directions calculated to ${modalStore.unit}!`)} className="flex-1 bg-[#f04b4c] hover:bg-[#e0474c] text-white text-xs font-semibold py-2.5 rounded-xl shadow-lg">
                    🗺️ Navigate Here
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(container).render(<App />);
    } else {
      ReactDOM.render(<App />, container);
    }
  </script>
  <script src="nav.js"></script>
</body>
</html>
