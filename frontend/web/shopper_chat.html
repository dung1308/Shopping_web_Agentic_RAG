<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinMall AI — Shopper Conversational Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    .glass-card { background: rgba(21, 29, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-input { background: rgba(13, 20, 34, 0.9); border: 1px solid rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="app-nav"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("Caught by ErrorBoundary:", error, errorInfo);
        this.setState({ errorInfo });
      }

      render() {
        if (this.state.hasError) {
          const errorText = `${this.state.error?.toString()}\n\nStack:\n${this.state.errorInfo?.componentStack || this.state.error?.stack || 'No stack trace'}`;
          return (
            <div class="p-6 bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center max-w-4xl mx-auto">
              <div class="glass-card p-6 rounded-2xl border border-rose-500/40 bg-rose-950/20">
                <div class="flex items-center space-x-3 mb-4 text-rose-400">
                  <span class="text-2xl">⚠️</span>
                  <h2 class="text-lg font-bold">Component Error Caught Gracefully</h2>
                </div>
                <p class="text-xs text-slate-300 mb-4">
                  An unexpected error occurred in this view. Copy the error details below and paste them into the assistant:
                </p>
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 font-mono text-xs text-rose-300 overflow-x-auto mb-4 whitespace-pre-wrap max-h-60 select-all">
                  {errorText}
                </div>
                <div class="flex space-x-3">
                  <button 
                    onClick={() => navigator.clipboard.writeText(errorText).then(() => alert("Error logs copied to clipboard!"))}
                    class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow-lg"
                  >
                    📋 Copy Error Logs to Clipboard
                  </button>
                  <button 
                    onClick={() => window.location.reload()}
                    class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs px-4 py-2 rounded-xl transition border border-slate-700"
                  >
                    🔄 Reload Page
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const SAMPLE_PRODUCTS = [
      { id: 1, name: "Pedro Premium Leather Tote", store: "Pedro", floor: "Floor 2 • Unit 204", price: "790,000 VND", origPrice: "950,000 VND", discount: "17% OFF", tag: "BESTSELLER", image: "🛍️", desc: "Crafted from genuine calfskin leather with polished metallic accents and multi-pocket interior." },
      { id: 2, name: "Charles & Keith Quilted Bag", store: "Charles & Keith", floor: "Floor 2 • Unit 210", price: "750,000 VND", origPrice: "890,000 VND", discount: "15% OFF", tag: "POPULAR", image: "👜", desc: "Sleek quilted finish with detachable gold chain strap suitable for evening wear." },
      { id: 3, name: "Vascara Casual Crossbody", store: "Vascara", floor: "Floor 2 • Unit 218", price: "680,000 VND", origPrice: "850,000 VND", discount: "20% OFF", tag: "HOT DEAL", image: "👝", desc: "Lightweight weather-resistant synthetic leather with dual compartment zippers." },
      { id: 4, name: "LYN Signature Shoulder Pouch", store: "LYN Vietnam", floor: "Floor 2 • Unit 202", price: "820,000 VND", origPrice: "820,000 VND", discount: "NEW", tag: "NEW ARRIVAL", image: "🎒", desc: "Compact luxury shoulder pouch featuring monogram print and signature buckle." },
      { id: 5, name: "Zara Casual Canvas Shopper", store: "Zara", floor: "Floor 2 • Unit 201", price: "599,000 VND", origPrice: "799,000 VND", discount: "25% OFF", tag: "VALUE", image: "👜", desc: "Heavyweight organic cotton canvas tote with reinforced shoulder handles." },
      { id: 6, name: "Aldo Crossbody Mini Pouch", store: "Aldo", floor: "Floor 1 • Unit 112", price: "720,000 VND", origPrice: "900,000 VND", discount: "20% OFF", tag: "TRENDING", image: "👛", desc: "Chic mini pouch with vegan leather texture and snake chain accent." }
    ];

    function App() {
      const [messages, setMessages] = useState([
        { sender: 'ai', text: 'Hello! I am VinMall Concierge AI. How can I assist your shopping trip today?' }
      ]);
      const [inputQuery, setInputQuery] = useState('');
      const [selectedFloor, setSelectedFloor] = useState('All');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [selectedModel, setSelectedModel] = useState('gemini');
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);

      const scrollToBottom = () => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, isTyping]);

      const handleSend = async (e) => {
        e.preventDefault();
        if (!inputQuery.trim()) return;

        const userMsg = inputQuery.trim();
        setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
        setInputQuery('');
        setIsTyping(true);

        try {
          // Attempt live backend REST API call first
          const res = await fetch('/api/user/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMsg })
          });

          if (res.ok) {
            const data = await res.json();
            setIsTyping(false);
            setMessages(prev => [...prev, { sender: 'ai', text: data.answer || "I found matches for your search!" }]);
            return;
          }
        } catch (err) {
          console.log("Backend offline or unreachable, using smart conversational responder fallback.");
        }

        // Smart Conversational AI Fallback for Demo
        setTimeout(() => {
          setIsTyping(false);
          const lower = userMsg.toLowerCase();
          let responseText = "";

          if (lower.includes('buy') || lower.includes('order') || lower.includes('checkout') || lower.includes('ship') || lower.includes('address') || lower.includes('pay') || lower.includes('credit card') || lower.includes('delivery')) {
            responseText = "🔒 **Action Restricted**: VinMall AI operates strictly in **Anonymous Catalog Browsing Mode**.\n\n• **Direct Online Purchase & Address Entry**: Restricted for anonymous browsing.\n\n🏷️ **Product & Price Discovery**:\n1. 🛍️ **Pedro Premium Leather Tote** — Price: **790,000 VND** (17% OFF) | Store: Pedro (Floor 2 • Unit 204)\n2. 👜 **Charles & Keith Quilted Bag** — Price: **750,000 VND** | Store: Charles & Keith (Floor 2 • Unit 210)\n\n📍 **Store Location & Navigation Guide**:\nTo explore these items or complete your purchase in person, please navigate to **Floor 2 • Unit 204 (Pedro)** or **Unit 210 (Charles & Keith)**. You can click **🏬 Mall Map** above to view interactive store directions!";
          } else if (lower.includes('hello') || lower.includes('hi') || lower.includes('xin chào') || lower.includes('hey')) {
            responseText = "Hello! Welcome to VinMall Concierge AI. How can I help your shopping trip today? You can ask me for leather bags, shoes, jewelry, food, or store directions on Floor 1, 2, or 3!";
          } else if (lower.includes('what are') || lower.includes('what is') || lower.includes('list') || lower.includes('show')) {
            responseText = "Here are the top active recommendations matching your search:\n\n1. 🛍️ **Pedro Premium Leather Tote** — Store: Pedro (Floor 2 • Unit 204) — Price: 790,000 VND (17% OFF)\n2. 👜 **Charles & Keith Quilted Bag** — Store: Charles & Keith (Floor 2 • Unit 210) — Price: 750,000 VND\n3. 👝 **Vascara Casual Crossbody** — Store: Vascara (Floor 2 • Unit 218) — Price: 680,000 VND (20% OFF)\n4. 🎒 **LYN Signature Shoulder Pouch** — Store: LYN (Floor 2 • Unit 202) — Price: 820,000 VND";
          } else if (lower.includes('bag') || lower.includes('leather') || lower.includes('tote') || lower.includes('price') || lower.includes('under') || lower.includes('discount')) {
            responseText = `I searched VinMall ChromaDB vector database for "${userMsg}" and found 4 matching items on Floor 2! The best option under 800,000 VND is Pedro Premium Leather Tote (Unit 204) at 790,000 VND.`;
          } else {
            responseText = `I searched VinMall vector index for "${userMsg}". I recommend visiting Floor 2 for fashion & accessories or checking the interactive Mall Directory map on Floor 1!`;
          }

          setMessages(prev => [...prev, { sender: 'ai', text: responseText }]);
        }, 900);
      };

      const filteredProducts = SAMPLE_PRODUCTS.filter(p => {
        if (selectedFloor !== 'All' && !p.floor.includes(selectedFloor)) return false;
        return true;
      });

      return (
        <div class="flex-1 flex flex-col h-screen overflow-hidden">
          <div class="flex-1 flex overflow-hidden">
            <div class="w-2/5 border-r border-slate-800 flex flex-col glass-card">
              <div class="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-900/80">
                <span class="text-xs font-semibold text-slate-200">💬 AI Conversational Stream</span>
                <div class="flex items-center space-x-1.5">
                  <span class="text-[10px] text-slate-400 font-medium">Model:</span>
                  <select 
                    value={selectedModel} 
                    onChange={(e) => setSelectedModel(e.target.value)}
                    class="bg-slate-950 text-xs text-[#7acfd6] font-semibold border border-slate-700 rounded-lg px-2 py-1 focus:outline-none focus:border-[#f04b4c]"
                  >
                    <option value="gemini">⚡ Google Gemini (1.5 Flash)</option>
                    <option value="openai">🧠 OpenAI (GPT-4o-mini)</option>
                    <option value="anthropic">🔮 Anthropic (Claude 3.5)</option>
                    <option value="local">🤖 Local Ollama (Phi-3.5)</option>
                  </select>
                </div>
              </div>

              <div class="flex-1 p-4 overflow-y-auto space-y-4">
                {messages.map((m, idx) => (
                  <div key={idx} class={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div class={`max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-md whitespace-pre-line ${
                      m.sender === 'user'
                        ? 'bg-[#f04b4c] text-white rounded-br-none'
                        : 'bg-slate-800/90 text-slate-200 border border-slate-700/60 rounded-bl-none'
                    }`}>
                      {m.sender === 'ai' && <div class="text-xs font-bold text-[#7acfd6] mb-1">🤖 Concierge AI</div>}
                      {m.text}
                    </div>
                  </div>
                ))}

                {isTyping && (
                  <div class="flex justify-start">
                    <div class="bg-slate-800 text-slate-400 rounded-2xl px-4 py-3 text-xs flex items-center space-x-2 border border-slate-700">
                      <span class="w-2 h-2 bg-[#f04b4c] rounded-full animate-ping"></span>
                      <span>Searching ChromaDB vector index...</span>
                    </div>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              <form onSubmit={handleSend} class="p-4 border-t border-slate-800 bg-slate-900/80 flex items-center space-x-2">
                <input
                  type="text"
                  value={inputQuery}
                  onChange={(e) => setInputQuery(e.target.value)}
                  placeholder="Ask about shoes, jewelry, food, or discounts..."
                  class="flex-1 glass-input rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#f04b4c] transition"
                />
                <button type="submit" class="bg-[#f04b4c] hover:bg-[#e0474c] text-white px-4 py-2.5 rounded-xl font-medium text-sm transition shadow-lg flex items-center space-x-1">
                  <span>Send</span>
                  <span>➔</span>
                </button>
              </form>
            </div>

            <div class="w-3/5 flex flex-col bg-slate-950/60 p-6 overflow-y-auto">
              <div class="flex items-center justify-between mb-6">
                <div>
                  <h2 class="text-lg font-bold text-white">Discovered Products</h2>
                  <p class="text-xs text-slate-400">Showing top matching vector search items in VinMall</p>
                </div>

                <div class="flex items-center space-x-2">
                  <span class="text-xs text-slate-400 font-medium">Floor:</span>
                  {['All', 'Floor 1', 'Floor 2', 'Floor 3'].map(floor => (
                    <button
                      key={floor}
                      onClick={() => setSelectedFloor(floor)}
                      class={`text-xs px-3 py-1.5 rounded-lg border font-medium transition ${
                        selectedFloor === floor
                          ? 'bg-[#f04b4c] border-[#e0474c] text-white'
                          : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'
                      }`}
                    >
                      {floor}
                    </button>
                  ))}
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                {filteredProducts.map(product => (
                  <div
                    key={product.id}
                    onClick={() => setSelectedProduct(product)}
                    class="glass-card rounded-2xl p-5 border border-slate-800 hover:border-[#f04b4c]/60 transition cursor-pointer group hover:scale-[1.01] flex flex-col justify-between"
                  >
                    <div>
                      <div class="flex items-center justify-between mb-3">
                        <span class="text-3xl">{product.image}</span>
                        <span class="bg-[#f04b4c]/20 text-[#f04b4c] text-[10px] font-bold px-2.5 py-1 rounded-full border border-[#f04b4c]/30">
                          {product.tag}
                        </span>
                      </div>

                      <h3 class="font-semibold text-white group-hover:text-[#7acfd6] transition text-sm mb-1">
                        {product.name}
                      </h3>
                      <p class="text-xs text-slate-400 mb-3">{product.floor}</p>
                    </div>

                    <div>
                      <div class="flex items-baseline space-x-2 mb-3">
                        <span class="text-base font-bold text-[#7acfd6]">{product.price}</span>
                        <span class="text-xs text-slate-500 line-through">{product.origPrice}</span>
                        <span class="text-[10px] text-[#ad974f] font-semibold">{product.discount}</span>
                      </div>

                      <button class="w-full bg-slate-800 hover:bg-[#f04b4c] text-slate-300 hover:text-white text-xs font-semibold py-2 rounded-xl transition border border-slate-700 flex items-center justify-center space-x-1">
                        <span>📍 View Store Details</span>
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {selectedProduct && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="glass-card max-w-md w-full rounded-2xl p-6 border border-slate-700 shadow-2xl">
                <div class="flex justify-between items-start mb-4">
                  <div class="flex items-center space-x-3">
                    <span class="text-4xl">{selectedProduct.image}</span>
                    <div>
                      <h3 class="text-lg font-bold text-white">{selectedProduct.name}</h3>
                      <p class="text-xs text-[#7acfd6] font-semibold">{selectedProduct.store} • {selectedProduct.floor}</p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedProduct(null)} class="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <p class="text-xs text-slate-300 mb-4 leading-relaxed">{selectedProduct.desc}</p>

                <div class="bg-slate-900/80 rounded-xl p-4 mb-6 border border-slate-800 flex justify-between items-center">
                  <div>
                    <div class="text-xs text-slate-400">Current Offer Price</div>
                    <div class="text-xl font-bold text-[#7acfd6]">{selectedProduct.price}</div>
                  </div>
                  <span class="bg-[#ad974f]/20 text-[#ad974f] text-xs font-bold px-3 py-1 rounded-full border border-[#ad974f]/30">
                    {selectedProduct.discount}
                  </span>
                </div>

                <div class="flex space-x-3">
                  <button onClick={() => setSelectedProduct(null)} class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold py-2.5 rounded-xl border border-slate-700">
                    Close
                  </button>
                  <button onClick={() => alert(`Directions loaded for ${selectedProduct.store}!`)} class="flex-1 bg-[#f04b4c] hover:bg-[#e0474c] text-white text-xs font-semibold py-2.5 rounded-xl shadow-lg">
                    🗺️ Navigate Store
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(container).render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    } else {
      ReactDOM.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>,
        container
      );
    }
  </script>
  <script src="nav.js"></script>
</body>
</html>
