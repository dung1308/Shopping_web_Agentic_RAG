<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mall RAG — Raw Document & Link Ingestion Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    .glass-card { background: rgba(21, 29, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .code-bg { background: #080d16; font-family: 'Consolas', monospace; }
  </style>

  <!-- Global Error Logger Fallback -->
  <script>
    window.addEventListener('error', function(e) {
      var root = document.getElementById('root');
      if (root && !root.dataset.errorDisplayed) {
        root.dataset.errorDisplayed = "true";
        var msg = (e.error && e.error.stack) ? e.error.stack : (e.message + " at " + (e.filename || 'script') + ":" + (e.lineno || 0));
        root.innerHTML = '<div style="padding: 24px; background: #0b0f19; color: #f8fafc; min-height: 100vh; font-family: sans-serif;">' +
          '<div style="background: rgba(225, 29, 72, 0.15); border: 1px solid rgba(225, 29, 72, 0.5); padding: 24px; border-radius: 16px; max-width: 800px; margin: 40px auto;">' +
            '<h2 style="color: #f43f5e; margin-top: 0;">⚠️ Page Execution Error Caught</h2>' +
            '<p style="font-size: 13px; color: #cbd5e1;">Copy the error details below and paste them into the assistant:</p>' +
            '<pre id="err-box" style="background: #080d16; border: 1px solid #1e293b; color: #fda4af; padding: 16px; border-radius: 12px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all;">' + msg + '</pre>' +
            '<button onclick="navigator.clipboard.writeText(document.getElementById(\'err-box\').innerText).then(function(){alert(\'Copied error logs to clipboard!\')})" style="background: #e11d48; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer;">📋 Copy Error Logs to Clipboard</button>' +
            '<button onclick="window.location.reload()" style="background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-left: 10px;">🔄 Reload Page</button>' +
          '</div>' +
        '</div>';
      }
    });
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
  <div id="app-nav"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("Caught by ErrorBoundary:", error, errorInfo);
        this.setState({ errorInfo });
      }

      render() {
        if (this.state.hasError) {
          const errorText = `${this.state.error?.toString()}\n\nStack:\n${this.state.errorInfo?.componentStack || this.state.error?.stack || 'No stack trace'}`;
          return (
            <div className="p-6 bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center max-w-4xl mx-auto">
              <div className="glass-card p-6 rounded-2xl border border-rose-500/40 bg-rose-950/20">
                <div className="flex items-center space-x-3 mb-4 text-rose-400">
                  <span className="text-2xl">⚠️</span>
                  <h2 className="text-lg font-bold">Component Error Caught Gracefully</h2>
                </div>
                <p className="text-xs text-slate-300 mb-4">
                  An unexpected error occurred in this view. Copy the error details below and paste them into the assistant:
                </p>
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 font-mono text-xs text-rose-300 overflow-x-auto mb-4 whitespace-pre-wrap max-h-60 select-all">
                  {errorText}
                </div>
                <div className="flex space-x-3">
                  <button 
                    onClick={() => navigator.clipboard.writeText(errorText).then(() => alert("Error logs copied to clipboard!"))}
                    className="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow-lg"
                  >
                    📋 Copy Error Logs to Clipboard
                  </button>
                  <button 
                    onClick={() => window.location.reload()}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs px-4 py-2 rounded-xl transition border border-slate-700"
                  >
                    🔄 Reload Page
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      const [activeTab, setActiveTab] = useState('link');
      const [storeName, setStoreName] = useState('Zara Online');
      const [storeId, setStoreId] = useState('store-zara-online');
      const [isOnline, setIsOnline] = useState(true);
      const [floor, setFloor] = useState('Online');
      
      const [rawLink, setRawLink] = useState('https://zara.com.vn/en/catalog.pdf');
      const [rawText, setRawText] = useState('Zara Men Autumn Collection 2026: Leather jackets starting from 1,850,000 VND.');
      const [selectedFile, setSelectedFile] = useState(null);
      
      const [isIngesting, setIsIngesting] = useState(false);
      const [pipelineLogs, setPipelineLogs] = useState([
        { time: '18:55:01', step: 'Ready', msg: 'Document & Online Link Ingestion Studio initialized. Select a source to ingest.' }
      ]);

      const handleStoreNameChange = (val) => {
        setStoreName(val);
        const autoId = 'store-' + val.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        setStoreId(autoId);
      };

      const handleOnlineToggle = (e) => {
        const checked = e.target.checked;
        setIsOnline(checked);
        if (checked) {
          setFloor('Online');
        } else {
          setFloor(2);
        }
      };

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files[0]) {
          setSelectedFile(e.target.files[0]);
        }
      };

      const handleStartIngest = async () => {
        setIsIngesting(true);
        const timeNow = () => new Date().toLocaleTimeString();

        setPipelineLogs(prev => [
          ...prev,
          { time: timeNow(), step: '1. Format Detection', msg: `Detecting format for source (${activeTab.toUpperCase()})...` }
        ]);

        await new Promise(r => setTimeout(r, 800));

        setPipelineLogs(prev => [
          ...prev,
          { time: timeNow(), step: '2. Docling & Playwright Extraction', msg: isOnline ? 'Crawling online web page JS & links...' : 'Extracting layout blocks via Docling engine...' }
        ]);

        await new Promise(r => setTimeout(r, 1000));

        setPipelineLogs(prev => [
          ...prev,
          { time: timeNow(), step: '3. Hierarchical Chunking', msg: 'Splitting into 512-token chunks with 64-token overlap...' }
        ]);

        await new Promise(r => setTimeout(r, 900));

        setPipelineLogs(prev => [
          ...prev,
          { time: timeNow(), step: '4. Vector Embedding', msg: 'Generating 1024-dim dense embeddings via BAAI/bge-m3 model...' }
        ]);

        await new Promise(r => setTimeout(r, 1100));

        setPipelineLogs(prev => [
          ...prev,
          { time: timeNow(), step: '5. ChromaDB Indexing', msg: `Upserted vector chunks into ChromaDB (Store ID: ${storeId}, Store: ${storeName}, Location: ${isOnline ? 'Online / Web' : 'Floor ' + floor})` }
        ]);

        setIsIngesting(false);
      };

      return (
        <div className="flex-1 flex flex-col p-6 space-y-6">

          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <div className="flex items-center space-x-3">
                <span className="text-xl">📥</span>
                <h1 className="text-lg font-bold text-white tracking-wide">Document & Online Link Ingestion Studio</h1>
              </div>
              <p className="text-xs text-[#7acfd6] mt-1">Upload raw files (PDF, DOCX) or ingest online web URLs into ChromaDB RAG index</p>
            </div>
            <div className="flex items-center space-x-2">
              <span className="bg-purple-500/10 text-purple-400 border border-purple-500/20 text-xs px-3 py-1.5 rounded-xl font-mono">
                Collection: mall_documents
              </span>
            </div>
          </div>

          <div className="grid grid-cols-12 gap-6 flex-1">
            <div className="col-span-6 glass-card rounded-2xl p-6 flex flex-col space-y-5">
              
              <div className="space-y-3 bg-slate-900/90 p-4 rounded-xl border border-slate-800">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <span className="text-xs font-bold text-slate-200">🏪 Store Metadata & Location Settings</span>
                  
                  <label className="flex items-center space-x-2 cursor-pointer bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-700">
                    <input 
                      type="checkbox" 
                      checked={isOnline} 
                      onChange={handleOnlineToggle}
                      className="rounded accent-[#f04b4c]" 
                    />
                    <span className="text-xs font-semibold text-[#7acfd6]">Online Store (No Physical Floor)</span>
                  </label>
                </div>

                <div className="grid grid-cols-3 gap-3 pt-1">
                  <div>
                    <label className="text-[11px] font-bold text-slate-400 block mb-1">Store Name</label>
                    <input 
                      type="text" 
                      value={storeName} 
                      onChange={e => handleStoreNameChange(e.target.value)} 
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:border-[#f04b4c]"
                    />
                  </div>
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-[11px] font-bold text-slate-400">Store ID</label>
                      <span className="text-[9px] text-slate-500" title="Used as a unique filter key in ChromaDB">❓ Why ID</span>
                    </div>
                    <input 
                      type="text" 
                      value={storeId} 
                      onChange={e => setStoreId(e.target.value)} 
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-300 font-mono"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-400 block mb-1">
                      {isOnline ? 'Location' : 'Floor Level'}
                    </label>
                    {isOnline ? (
                      <input 
                        type="text" 
                        disabled 
                        value="Online / Web" 
                        className="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-[#7acfd6] font-semibold cursor-not-allowed"
                      />
                    ) : (
                      <input 
                        type="number" 
                        min="1" 
                        max="10" 
                        value={floor} 
                        onChange={e => setFloor(e.target.value)} 
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                      />
                    )}
                  </div>
                </div>
                <p className="text-[10px] text-slate-400 italic">
                  💡 <b>Store ID</b> is a unique metadata filter used by ChromaDB to update or delete vectors for a specific store without affecting other stores.
                </p>
              </div>

              <div>
                <label className="text-xs font-bold text-slate-300 block mb-2">Select Ingestion Source Type</label>
                <div className="grid grid-cols-3 gap-2 p-1 bg-slate-900 rounded-xl border border-slate-800">
                  <button 
                    onClick={() => setActiveTab('link')}
                    className={`py-2 text-xs font-bold rounded-lg transition ${activeTab === 'link' ? 'bg-[#f04b4c] text-white shadow' : 'text-slate-400 hover:text-white'}`}
                  >
                    🌐 Online Web Link / PDF URL
                  </button>
                  <button 
                    onClick={() => setActiveTab('file')}
                    className={`py-2 text-xs font-bold rounded-lg transition ${activeTab === 'file' ? 'bg-[#f04b4c] text-white shadow' : 'text-slate-400 hover:text-white'}`}
                  >
                    📄 Raw File (PDF/DOCX)
                  </button>
                  <button 
                    onClick={() => setActiveTab('text')}
                    className={`py-2 text-xs font-bold rounded-lg transition ${activeTab === 'text' ? 'bg-[#f04b4c] text-white shadow' : 'text-slate-400 hover:text-white'}`}
                  >
                    📝 Raw Text / HTML
                  </button>
                </div>
              </div>

              <div className="flex-1 flex flex-col justify-center">
                {activeTab === 'link' && (
                  <div className="space-y-2">
                    <label className="text-xs text-slate-400 font-semibold block">Paste Online Web Store URL or Direct PDF Link</label>
                    <input 
                      type="url" 
                      value={rawLink}
                      onChange={e => setRawLink(e.target.value)}
                      placeholder="https://zara.com/vn/en or https://example.com/catalog.pdf" 
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#f04b4c]"
                    />
                    <p className="text-[10px] text-slate-400">Playwright will render JS e-commerce pages or download PDF binaries directly.</p>
                  </div>
                )}

                {activeTab === 'file' && (
                  <div className="border-2 border-dashed border-slate-700 hover:border-[#f04b4c] bg-slate-900/50 rounded-2xl p-8 text-center transition cursor-pointer relative">
                    <input 
                      type="file" 
                      onChange={handleFileChange} 
                      accept=".pdf,.docx,.txt,.json,.png,.jpg,.jpeg" 
                      className="absolute inset-0 opacity-0 cursor-pointer"
                    />
                    <div className="text-3xl mb-2">📁</div>
                    <div className="text-xs font-bold text-white mb-1">
                      {selectedFile ? selectedFile.name : 'Click or Drag & Drop File Here'}
                    </div>
                    <p className="text-[10px] text-slate-400">
                      Supports PDF, DOCX, TXT, JSON, PNG, JPG (Max 50MB)
                    </p>
                  </div>
                )}

                {activeTab === 'text' && (
                  <div className="space-y-2">
                    <label className="text-xs text-slate-400 font-semibold block">Paste Raw Text or HTML String</label>
                    <textarea 
                      rows="5"
                      value={rawText}
                      onChange={e => setRawText(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-[#f04b4c]"
                    ></textarea>
                  </div>
                )}
              </div>

              <button 
                onClick={handleStartIngest}
                disabled={isIngesting}
                className="w-full bg-gradient-to-r from-[#f04b4c] to-[#ad974f] hover:from-[#e0474c] hover:to-[#9d873f] text-white text-xs font-bold py-3 rounded-xl transition shadow-lg shadow-rose-600/20 flex items-center justify-center space-x-2"
              >
                <span>{isIngesting ? '⏳ Processing & Vectorizing...' : '⚡ Ingest & Index to ChromaDB'}</span>
              </button>
            </div>

            <div className="col-span-6 glass-card rounded-2xl p-6 flex flex-col">
              <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <h2 className="text-sm font-bold text-white flex items-center space-x-2">
                  <span>⚙️</span>
                  <span>Pipeline Execution Monitor</span>
                </h2>
                <span className="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
                  Docling + bge-m3 Active
                </span>
              </div>

              <div className="flex-1 code-bg rounded-xl p-4 overflow-y-auto space-y-3 text-xs border border-slate-800">
                {pipelineLogs.map((log, idx) => (
                  <div key={idx} className="border-b border-slate-800/60 pb-2">
                    <div className="flex items-center justify-between text-[10px] text-slate-400 mb-1">
                      <span className="font-bold text-[#7acfd6]">{log.step}</span>
                      <span>{log.time}</span>
                    </div>
                    <div className="text-slate-200">{log.msg}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(container).render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    } else {
      ReactDOM.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>,
        container
      );
    }
  </script>
  <script src="nav.js"></script>
</body>
</html>
