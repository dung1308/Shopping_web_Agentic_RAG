<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinMall Scraper — Playwright Pipeline Manager</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    .glass-card { background: rgba(21, 29, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .terminal-bg { background: #080d16; font-family: 'Consolas', monospace; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_LOGS = [
      { time: '22:23:01', level: 'INFO', msg: '[ScraperEngine] Initialized Playwright Chromium Headless Context pool (concurrency=5)' },
      { time: '22:23:03', level: 'INFO', msg: '[RobotsValidator] Fetched https://zara.com/robots.txt -> Allowed crawl depth max 3' },
      { time: '22:23:05', level: 'WARN', msg: '[AuditFlag] Price validation warning on item #8911 (Zara): 22,500,000 VND exceeds 15M cap' },
      { time: '22:23:07', level: 'INFO', msg: '[QdrantIndexer] Generating 1024-dim dense vector embedding via bge-m3 model...' },
      { time: '22:23:09', level: 'SUCCESS', msg: '[QdrantIndexer] Upserted 128 points into Qdrant collection `mall_products`' },
      { time: '22:23:11', level: 'INFO', msg: '[RedisCache] Invalidation signal published for channel `store_catalogs`' },
    ];

    function App() {
      const [logs, setLogs] = useState(INITIAL_LOGS);
      const [isRunning, setIsRunning] = useState(true);
      const [targetUrl, setTargetUrl] = useState('https://zara.com/vn/en/category/woman-bags');
      const [concurrency, setConcurrency] = useState(5);
      const terminalEndRef = useRef(null);

      useEffect(() => {
        if (!isRunning) return;
        const interval = setInterval(() => {
          const times = new Date().toLocaleTimeString();
          const levels = ['INFO', 'INFO', 'WARN', 'SUCCESS'];
          const lvl = levels[Math.floor(Math.random() * levels.length)];
          const sampleMsgs = [
            `[Playwright] Extracted 24 product DOM elements from target URL`,
            `[Validator] Checked Pydantic schema for product category 'Footwear'`,
            `[AuditFlag] Price bound check passed (1,290,000 VND < 25M cap)`,
            `[QdrantIndexer] Embedding batch synced to Qdrant vector database`
          ];
          const m = sampleMsgs[Math.floor(Math.random() * sampleMsgs.length)];

          setLogs(prev => [...prev.slice(-30), { time: times, level: lvl, msg: m }]);
        }, 2500);

        return () => clearInterval(interval);
      }, [isRunning]);

      const scrollToBottom = () => terminalEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      useEffect(scrollToBottom, [logs]);

      return (
        <div className="flex-1 flex flex-col p-6 space-y-6">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <div className="flex items-center space-x-3">
                <span className="text-2xl">🕷️</span>
                <h1 className="text-xl font-bold text-white tracking-wide">Playwright Scraper Workflow Engine</h1>
              </div>
              <p className="text-xs text-[#7acfd6] mt-1">Hook Agency 2026 Theme • Automated crawler, Robots.txt parser & validation pipeline</p>
            </div>

            <div className="flex items-center space-x-3">
              <span className={`w-3 h-3 rounded-full ${isRunning ? 'bg-emerald-400 animate-ping' : 'bg-[#f04b4c]'}`}></span>
              <span className="text-xs font-semibold text-slate-300">{isRunning ? 'Crawler Active' : 'Crawler Stopped'}</span>
              <button
                onClick={() => setIsRunning(!isRunning)}
                className={`text-xs font-bold px-4 py-2 rounded-xl transition ${
                  isRunning ? 'bg-[#f04b4c] hover:bg-[#e0474c] text-white' : 'bg-emerald-600 hover:bg-emerald-500 text-white'
                }`}
              >
                {isRunning ? '⏹ Stop Pipeline' : '▶ Start Pipeline'}
              </button>
            </div>
          </div>

          <div className="flex-1 grid grid-cols-12 gap-6 overflow-hidden">
            <div className="col-span-4 glass-card rounded-2xl p-5 flex flex-col space-y-4">
              <h2 className="text-sm font-bold text-white flex items-center space-x-2">
                <span>⚙️</span>
                <span>Crawler Target Settings</span>
              </h2>

              <div>
                <label className="text-xs text-slate-400 block mb-1 font-semibold">Target URL Entrypoint</label>
                <input
                  type="text"
                  value={targetUrl}
                  onChange={(e) => setTargetUrl(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#f04b4c]"
                />
              </div>

              <div>
                <label className="text-xs text-slate-400 block mb-1 font-semibold">Worker Concurrency ({concurrency} Parallel Chromiums)</label>
                <input
                  type="range"
                  min="1"
                  max="10"
                  value={concurrency}
                  onChange={(e) => setConcurrency(e.target.value)}
                  className="w-full accent-[#f04b4c]"
                />
              </div>

              <div className="border-t border-slate-800 pt-4 space-y-2">
                <label className="text-xs text-slate-400 block font-semibold mb-2">Governance Controls</label>
                <div className="flex items-center space-x-2 text-xs text-slate-300">
                  <input type="checkbox" defaultChecked className="rounded accent-[#f04b4c]" />
                  <span>Enforce strict `robots.txt` rules</span>
                </div>
                <div className="flex items-center space-x-2 text-xs text-slate-300">
                  <input type="checkbox" defaultChecked className="rounded accent-[#f04b4c]" />
                  <span>Flag expired deals (>365 days)</span>
                </div>
                <div className="flex items-center space-x-2 text-xs text-slate-300">
                  <input type="checkbox" defaultChecked className="rounded accent-[#f04b4c]" />
                  <span>Auto-upsert vectors to Qdrant</span>
                </div>
              </div>

              <div className="mt-auto pt-4 border-t border-slate-800 flex space-x-3">
                <button className="flex-1 bg-[#f04b4c] hover:bg-[#e0474c] text-white text-xs font-semibold py-2.5 rounded-xl transition">
                  🚀 Launch Job
                </button>
              </div>
            </div>

            <div className="col-span-8 glass-card rounded-2xl p-5 flex flex-col">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-sm font-bold text-white flex items-center space-x-2">
                  <span>📜</span>
                  <span>Live Execution Audit Console</span>
                </h2>
                <span className="text-[10px] text-slate-400 font-mono">Stream: WebSocket /ws/scrape-log</span>
              </div>

              <div className="flex-1 terminal-bg rounded-xl p-4 overflow-y-auto space-y-2 text-xs border border-slate-800">
                {logs.map((l, i) => (
                  <div key={i} className="flex items-start space-x-3 font-mono">
                    <span className="text-slate-500">[{l.time}]</span>
                    <span className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${
                      l.level === 'INFO' ? 'bg-slate-900 text-[#7acfd6] border border-slate-800' :
                      l.level === 'WARN' ? 'bg-amber-950 text-[#ad974f] border border-amber-800' :
                      'bg-emerald-950 text-emerald-300 border border-emerald-800'
                    }`}>
                      {l.level}
                    </span>
                    <span className="text-slate-200">{l.msg}</span>
                  </div>
                ))}
                <div ref={terminalEndRef} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
