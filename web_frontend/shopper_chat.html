<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinMall AI — Shopper Conversational Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    .glass-card { background: rgba(21, 29, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-input { background: rgba(13, 20, 34, 0.9); border: 1px solid rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SAMPLE_PRODUCTS = [
      { id: 1, name: "Pedro Premium Leather Tote", store: "Pedro", floor: "Floor 2 • Unit 204", price: "790,000 VND", origPrice: "950,000 VND", discount: "17% OFF", tag: "BESTSELLER", image: "🛍️", desc: "Crafted from genuine calfskin leather with polished metallic accents and multi-pocket interior." },
      { id: 2, name: "Charles & Keith Quilted Bag", store: "Charles & Keith", floor: "Floor 2 • Unit 210", price: "750,000 VND", origPrice: "890,000 VND", discount: "15% OFF", tag: "POPULAR", image: "👜", desc: "Sleek quilted finish with detachable gold chain strap suitable for evening wear." },
      { id: 3, name: "Vascara Casual Crossbody", store: "Vascara", floor: "Floor 2 • Unit 218", price: "680,000 VND", origPrice: "850,000 VND", discount: "20% OFF", tag: "HOT DEAL", image: "👝", desc: "Lightweight weather-resistant synthetic leather with dual compartment zippers." },
      { id: 4, name: "LYN Signature Shoulder Pouch", store: "LYN Vietnam", floor: "Floor 2 • Unit 202", price: "820,000 VND", origPrice: "820,000 VND", discount: "NEW", tag: "NEW ARRIVAL", image: "🎒", desc: "Compact luxury shoulder pouch featuring monogram print and signature buckle." },
      { id: 5, name: "Zara Casual Canvas Shopper", store: "Zara", floor: "Floor 2 • Unit 201", price: "599,000 VND", origPrice: "799,000 VND", discount: "25% OFF", tag: "VALUE", image: "👜", desc: "Heavyweight organic cotton canvas tote with reinforced shoulder handles." },
      { id: 6, name: "Aldo Crossbody Mini Pouch", store: "Aldo", floor: "Floor 1 • Unit 112", price: "720,000 VND", origPrice: "900,000 VND", discount: "20% OFF", tag: "TRENDING", image: "👛", desc: "Chic mini pouch with vegan leather texture and snake chain accent." }
    ];

    function App() {
      const [messages, setMessages] = useState([
        { sender: 'ai', text: 'Hello! I am VinMall Concierge AI. How can I assist your shopping trip today?' },
        { sender: 'user', text: 'Where can I find a leather bag under 800k on Floor 2?' },
        { sender: 'ai', text: 'I searched VinMall Qdrant vector database and found 5 matching leather bags under 800,000 VND on Floor 2! Here are the best options:' }
      ]);
      const [inputQuery, setInputQuery] = useState('');
      const [selectedFloor, setSelectedFloor] = useState('All');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);

      const scrollToBottom = () => chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      useEffect(scrollToBottom, [messages, isTyping]);

      const handleSend = (e) => {
        e.preventDefault();
        if (!inputQuery.trim()) return;

        const userMsg = inputQuery;
        setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
        setInputQuery('');
        setIsTyping(true);

        setTimeout(() => {
          setIsTyping(false);
          setMessages(prev => [
            ...prev,
            { sender: 'ai', text: `Searching vector database for "${userMsg}"... Found 4 matching items with high relevance scores!` }
          ]);
        }, 1200);
      };

      const filteredProducts = SAMPLE_PRODUCTS.filter(p => {
        if (selectedFloor !== 'All' && !p.floor.includes(selectedFloor)) return false;
        return true;
      });

      return (
        <div className="flex-1 flex flex-col h-screen overflow-hidden">
          <header className="glass-card px-6 py-4 flex items-center justify-between border-b border-slate-800">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-[#f04b4c] flex items-center justify-center text-xl shadow-lg shadow-rose-600/30">
                ✨
              </div>
              <div>
                <h1 className="text-lg font-bold text-white tracking-wide">VinMall AI Concierge</h1>
                <p className="text-xs text-[#7acfd6]">Web Frontend Client • Dual-View Shopping Assistant</p>
              </div>
            </div>

            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 text-xs">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-slate-300 font-medium">Qdrant Hybrid RAG Active</span>
              </div>
              <button className="bg-[#f04b4c] hover:bg-[#e0474c] text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow-md">
                📍 Mall Map Guide
              </button>
            </div>
          </header>

          <div className="flex-1 flex overflow-hidden">
            <div className="w-2/5 border-r border-slate-800 flex flex-col glass-card">
              <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                <span className="text-sm font-semibold text-slate-200">💬 Conversational AI Stream</span>
                <span className="text-xs text-[#7acfd6] bg-slate-900 px-2.5 py-1 rounded-md border border-slate-800">
                  Llama 3.1 70B
                </span>
              </div>

              <div className="flex-1 p-4 overflow-y-auto space-y-4">
                {messages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-md ${
                      m.sender === 'user'
                        ? 'bg-[#f04b4c] text-white rounded-br-none'
                        : 'bg-slate-800/90 text-slate-200 border border-slate-700/60 rounded-bl-none'
                    }`}>
                      {m.sender === 'ai' && <div className="text-xs font-bold text-[#7acfd6] mb-1">🤖 Concierge AI</div>}
                      {m.text}
                    </div>
                  </div>
                ))}

                {isTyping && (
                  <div className="flex justify-start">
                    <div className="bg-slate-800 text-slate-400 rounded-2xl px-4 py-3 text-xs flex items-center space-x-2 border border-slate-700">
                      <span className="w-2 h-2 bg-[#f04b4c] rounded-full animate-ping"></span>
                      <span>Retrieving product vectors from Qdrant...</span>
                    </div>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              <form onSubmit={handleSend} className="p-4 border-t border-slate-800 bg-slate-900/80 flex items-center space-x-2">
                <input
                  type="text"
                  value={inputQuery}
                  onChange={(e) => setInputQuery(e.target.value)}
                  placeholder="Ask about shoes, jewelry, food, or discounts..."
                  className="flex-1 glass-input rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#f04b4c] transition"
                />
                <button type="submit" className="bg-[#f04b4c] hover:bg-[#e0474c] text-white px-4 py-2.5 rounded-xl font-medium text-sm transition shadow-lg flex items-center space-x-1">
                  <span>Send</span>
                  <span>➔</span>
                </button>
              </form>
            </div>

            <div className="w-3/5 flex flex-col bg-slate-950/60 p-6 overflow-y-auto">
              <div className="flex items-center justify-between mb-6">
                <div>
                  <h2 className="text-lg font-bold text-white">Discovered Products</h2>
                  <p className="text-xs text-slate-400">Showing top matching vector search items in VinMall</p>
                </div>

                <div className="flex items-center space-x-2">
                  <span className="text-xs text-slate-400 font-medium">Floor:</span>
                  {['All', 'Floor 1', 'Floor 2', 'Floor 3'].map(floor => (
                    <button
                      key={floor}
                      onClick={() => setSelectedFloor(floor)}
                      className={`text-xs px-3 py-1.5 rounded-lg border font-medium transition ${
                        selectedFloor === floor
                          ? 'bg-[#f04b4c] border-[#e0474c] text-white'
                          : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'
                      }`}
                    >
                      {floor}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                {filteredProducts.map(product => (
                  <div
                    key={product.id}
                    onClick={() => setSelectedProduct(product)}
                    className="glass-card rounded-2xl p-5 border border-slate-800 hover:border-[#f04b4c]/60 transition cursor-pointer group hover:scale-[1.01] flex flex-col justify-between"
                  >
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-3xl">{product.image}</span>
                        <span className="bg-[#f04b4c]/20 text-[#f04b4c] text-[10px] font-bold px-2.5 py-1 rounded-full border border-[#f04b4c]/30">
                          {product.tag}
                        </span>
                      </div>

                      <h3 className="font-semibold text-white group-hover:text-[#7acfd6] transition text-sm mb-1">
                        {product.name}
                      </h3>
                      <p className="text-xs text-slate-400 mb-3">{product.floor}</p>
                    </div>

                    <div>
                      <div className="flex items-baseline space-x-2 mb-3">
                        <span className="text-base font-bold text-[#7acfd6]">{product.price}</span>
                        <span className="text-xs text-slate-500 line-through">{product.origPrice}</span>
                        <span className="text-[10px] text-[#ad974f] font-semibold">{product.discount}</span>
                      </div>

                      <button className="w-full bg-slate-800 hover:bg-[#f04b4c] text-slate-300 hover:text-white text-xs font-semibold py-2 rounded-xl transition border border-slate-700 flex items-center justify-center space-x-1">
                        <span>📍 View Store Details</span>
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {selectedProduct && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="glass-card max-w-md w-full rounded-2xl p-6 border border-slate-700 shadow-2xl">
                <div className="flex justify-between items-start mb-4">
                  <div className="flex items-center space-x-3">
                    <span className="text-4xl">{selectedProduct.image}</span>
                    <div>
                      <h3 className="text-lg font-bold text-white">{selectedProduct.name}</h3>
                      <p className="text-xs text-[#7acfd6] font-semibold">{selectedProduct.store} • {selectedProduct.floor}</p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedProduct(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <p className="text-xs text-slate-300 mb-4 leading-relaxed">{selectedProduct.desc}</p>

                <div className="bg-slate-900/80 rounded-xl p-4 mb-6 border border-slate-800 flex justify-between items-center">
                  <div>
                    <div className="text-xs text-slate-400">Current Offer Price</div>
                    <div className="text-xl font-bold text-[#7acfd6]">{selectedProduct.price}</div>
                  </div>
                  <span className="bg-[#ad974f]/20 text-[#ad974f] text-xs font-bold px-3 py-1 rounded-full border border-[#ad974f]/30">
                    {selectedProduct.discount}
                  </span>
                </div>

                <div className="flex space-x-3">
                  <button onClick={() => setSelectedProduct(null)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold py-2.5 rounded-xl border border-slate-700">
                    Close
                  </button>
                  <button onClick={() => alert(`Directions loaded for ${selectedProduct.store}!`)} className="flex-1 bg-[#f04b4c] hover:bg-[#e0474c] text-white text-xs font-semibold py-2.5 rounded-xl shadow-lg">
                    🗺️ Navigate Store
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(container).render(<App />);
    } else {
      ReactDOM.render(<App />, container);
    }
  </script>
</body>
</html>
