[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mall-rag"
version = "1.0.0"
description = "Dual-View Agentic RAG System for Shopping Mall"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",

    # Async DB
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",

    # Validation
    "pydantic>=2.9.0",
    "pydantic-ai>=0.0.14",
    "pydantic-settings>=2.6.0",

    # LangGraph / LangChain
    "langgraph>=0.2.35",
    "langchain>=0.3.7",
    "langchain-community>=0.3.7",
    "langchain-openai>=0.2.8",       # Used for OpenAI-compat local endpoint

    # Vector DB
    "chromadb>=0.6.0",

    # Cache
    "redis[hiredis]>=5.2.0",

    # Scraping
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",

    # Document extraction (Docling)
    "docling>=2.36.0",
    "docling-core>=2.36.0",
    "python-docx>=1.1.0",
    "pillow>=11.0.0",

    # Multi-provider LLM (LiteLLM + individual SDKs)
    "litellm>=1.55.0",
    "openai>=1.58.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",

    # MCP
    "mcp>=1.1.0",

    # Utilities
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
mall-ingest = "backend.ingest.cli:app"
mall-graph  = "backend.agents.debug_runner:app"
mall-docs   = "backend.ingest.cli:app"
mall-serve  = "bridge.main:start"

[tool.setuptools.packages.find]
include = ["backend*", "bridge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
